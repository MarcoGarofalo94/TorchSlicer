services:
  coordinator:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: coordinator
    environment:
      - PYTHONUNBUFFERED=1
      - EPOCHS
      - USE_GPIPE
      - N_MICRO
      - N_WORKERS
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/coordinator/main.py
    depends_on:
      - worker1
      - worker2
      - worker3
      - worker4
    networks:
      - torchslicer-net

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker1
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker2:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker2
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker3:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker3
    environment:
      - PYTHONUNBUFFERED=1
