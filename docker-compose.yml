services:
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI  →  http://localhost:16686
      - "4317:4317"     # OTLP gRPC  (services inside the network use jaeger:4317)
    networks:
      - torchslicer-net

  coordinator:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: coordinator
    environment:
      - PYTHONUNBUFFERED=1
      # Remove or comment out the two OTEL_ lines to disable tracing entirely
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=torchslicer-coordinator
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/coordinator/main.py
    depends_on:
      - worker1
      - worker2
      - jaeger
    networks:
      - torchslicer-net

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker1
    environment:
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=torchslicer-worker
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker2:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker2
    environment:
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=torchslicer-worker
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

networks:
  torchslicer-net:
    driver: bridge
