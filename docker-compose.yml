services:
  coordinator:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: coordinator
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      # ── experiment config ──────────────────────────────────────────────────
      # Set EXPERIMENT_CONFIG to a YAML path to use file-based config.
      # Individual env vars below override YAML values when set.
      - EXPERIMENT_CONFIG
      - RUN_ID
      - N_WORKERS
      - EPOCHS
      - USE_GPIPE
      - N_MICRO
      - MIXED_PRECISION
      - DISCOVERY_BACKEND
      - DISCOVERY_TIMEOUT
      - WORKER_PEERS
      # ── checkpoint ────────────────────────────────────────────────────────
      - CHECKPOINT_ENABLED
      - CHECKPOINT_DIR
      - CHECKPOINT_SAVE_EVERY
      - CHECKPOINT_RESUME
      # ── logging & profiling ───────────────────────────────────────────────
      - LOG_ENABLED
      - LOG_DIR
      - PROFILE_VERBOSITY
      - PROFILE_MEMORY
      # ── post-run behaviour ────────────────────────────────────────────────
      # Coordinator blocks on signal.pause() after training and exits only
      # on SIGTERM/SIGINT. Use `docker compose down` to stop the stack.
    volumes:
      - .:/workspace          # ./runs/ lands here on the host automatically
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/coordinator/main.py
    networks:
      - torchslicer-net

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker1
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_ADDRESS=coordinator:50054
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker2:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker2
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_ADDRESS=coordinator:50054
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker3:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker3
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_ADDRESS=coordinator:50054
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker4:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker4
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_ADDRESS=coordinator:50054
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

networks:
  torchslicer-net:
    driver: bridge
