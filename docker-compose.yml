# Centralized topology — coordinator + N workers.
#
# Quick start (CPU):
#   make run-centralized CONFIG=experiments/resnet18_4gpu.yaml
#
# Quick start (GPU):
#   make run-centralized DEVICE=gpu CONFIG=experiments/resnet18_4gpu.yaml
#
# Image selection via IMAGE_TAG env var (or .env file):
#   IMAGE_TAG=cpu  (default) — CPU-only torch install
#   IMAGE_TAG=gpu            — CUDA torch install; also requires docker-compose.gpu.yml
#
# Device selection per worker via DEVICE env var:
#   DEVICE=auto  (default) — use cuda if available, else cpu
#   DEVICE=cuda            — always use CUDA
#   DEVICE=cpu             — always use CPU
#
# All experiment parameters come from EXPERIMENT_CONFIG (YAML path) or individual env vars.
# N_WORKERS controls how many workers the coordinator waits for before dispatching slices.

x-worker: &worker
  build:
    context: .
    dockerfile: docker-images/Dockerfile.${IMAGE_TAG:-cpu}
  image: torchslicer:${IMAGE_TAG:-cpu}
  user: "${UID}:${GID}"
  environment:
    - PYTHONUNBUFFERED=1
    - EXPERIMENT_CONFIG
    - COORDINATOR_ADDRESS=${COORDINATOR_ADDRESS:-coordinator:50054}
    - DEVICE=${DEVICE:-auto}
    - PORT
    - WORKER_ADDRESS
    - WORKER_TAGS
    - TENSOR_TRANSPORT
    - TENSOR_PORT_OFFSET
    - FAULT_KILL_EPOCH
    - FAULT_KILL_DELAY_S
    - FAULT_KILL_EXIT_CODE
    - FAULT_RAISE_PHASE
    - FAULT_RAISE_BATCH_ID
    - FAULT_TARGET_WORKER_INDEX
  volumes:
    - .:/workspace
    - ./lib/torchslicer:/usr/local/lib/torchslicer
  command: ${WORKER_CMD:-python3 examples/train/centralized/GRPC/worker/main.py}
  networks:
    - torchslicer-net

services:
  coordinator:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.${IMAGE_TAG:-cpu}
    image: torchslicer:${IMAGE_TAG:-cpu}
    container_name: coordinator
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - EXPERIMENT_CONFIG
      - KEEP_ALIVE
      - COORDINATOR_ADDRESS
      - COORDINATOR_BIND_ADDRESS
      - RUN_ID
      - N_WORKERS
      - HF_HOME=${HF_HOME:-/workspace/.cache/huggingface}
      - HF_TOKEN
      - EPOCHS
      - USE_GPIPE
      - N_MICRO
      - MIXED_PRECISION
      - DISCOVERY_BACKEND
      - DISCOVERY_TIMEOUT
      - WORKER_PEERS
      - CHECKPOINT_ENABLED
      - CHECKPOINT_DIR
      - CHECKPOINT_SAVE_EVERY
      - CHECKPOINT_RESUME
      - LOG_ENABLED
      - LOG_DIR
      - PROFILE_VERBOSITY
      - PROFILE_MEMORY
      - FAULT_TOLERANCE_ENABLED
      - HEARTBEAT_INTERVAL
      - HEARTBEAT_TIMEOUT
      - FAULT_MAX_RETRIES
      - FAULT_COORDINATOR_EXIT_EPOCH
      - FAULT_COORDINATOR_EXIT_DELAY_S
      - FAULT_COORDINATOR_EXIT_CODE
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: ${COORDINATOR_CMD:-python3 examples/train/centralized/GRPC/coordinator/main.py}
    networks:
      - torchslicer-net

  worker1:
    <<: *worker
    container_name: worker1

  worker2:
    <<: *worker
    container_name: worker2

  worker3:
    <<: *worker
    container_name: worker3

  worker4:
    <<: *worker
    container_name: worker4

networks:
  torchslicer-net:
    driver: bridge
