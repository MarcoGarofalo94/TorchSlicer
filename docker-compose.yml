      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

  worker4:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: worker4
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/centralized/GRPC/worker/main.py
    networks:
      - torchslicer-net

networks:
  torchslicer-net:
    driver: bridge
