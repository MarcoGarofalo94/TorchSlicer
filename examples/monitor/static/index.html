<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TorchSlicer Monitor</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; height: 100vh; overflow: hidden; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  button { transition: all .15s; }
  button:hover { opacity: .85; }
  select { outline: none; }
  .recharts-tooltip-wrapper { font-size: 11px !important; }
</style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8b949e;font-size:13px">
    Loading dashboard…
  </div>
</div>

<script type="text/babel" data-presets="react">
// ── Theme ─────────────────────────────────────────────────────────────────────
const C = {
  bg: '#0d1117', surface: '#161b22', surface2: '#1c2128', border: '#30363d',
  text: '#e6edf3', muted: '#8b949e',
  blue: '#58a6ff', orange: '#f0883e', green: '#3fb950',
  purple: '#bc8cff', red: '#f85149', yellow: '#e3b341',
  mono: "'SF Mono','Fira Code','Cascadia Code',monospace",
};

const panel = {
  background: C.surface, border: `1px solid ${C.border}`,
  borderRadius: 8, padding: 14, overflow: 'hidden',
  display: 'flex', flexDirection: 'column',
};
const panelTitle = {
  fontSize: 10, fontWeight: 700, letterSpacing: '0.1em',
  textTransform: 'uppercase', color: C.muted, marginBottom: 10, flexShrink: 0,
};

// ── React + Recharts ──────────────────────────────────────────────────────────
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const {
  LineChart, Line, BarChart, Bar, XAxis, YAxis,
  CartesianGrid, Tooltip, Legend, Brush,
  ResponsiveContainer, ReferenceLine,
} = Recharts;

// ── WebSocket hook ────────────────────────────────────────────────────────────
function useWS() {
  const [data, setData]           = useState({ topology: [], batches: [], epochs: [] });
  const [connected, setConnected] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);

  useEffect(() => {
    let ws, timer;
    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen    = () => setConnected(true);
      ws.onmessage = e => { setData(JSON.parse(e.data)); setLastUpdate(new Date().toLocaleTimeString()); };
      ws.onclose   = () => { setConnected(false); timer = setTimeout(connect, 3000); };
      ws.onerror   = () => ws.close();
    }
    connect();
    return () => { clearTimeout(timer); ws?.close(); };
  }, []);

  return { data, connected, lastUpdate };
}

// ── SVG helpers ───────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

// ── Topology drawing ──────────────────────────────────────────────────────────
function drawTopology(svg, topology, W) {
  svg.innerHTML = '';
  if (!topology.length) {
    svg.appendChild(el('text', { x: '50%', y: 50, 'text-anchor': 'middle', fill: C.muted, 'font-size': 11 }, 'Waiting for workers…'));
    svg.setAttribute('height', 100);
    return;
  }

  const BW = Math.min(W - 88, 178);
  const BH_MIN = 72, LH = 14, GAP = 52, CX = W / 2;
  const ARROW_R = CX + BW / 2 + 14;
  const ARROW_L = CX - BW / 2 - 14;

  const defs = el('defs');
  for (const [id, fill] of [['mfwd', C.blue], ['mbwd', C.orange]]) {
    const m = el('marker', { id, markerWidth: 7, markerHeight: 5, refX: 6, refY: 2.5, orient: 'auto' });
    m.appendChild(el('polygon', { points: '0 0,7 2.5,0 5', fill }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);

  const allNodes = [null, ...topology];
  const heights  = allNodes.map((w, i) => i === 0 ? BH_MIN : BH_MIN + Math.max(0, w.layers.length - 2) * LH);
  const ys = [];
  let y = 16;
  heights.forEach(h => { ys.push(y); y += h + GAP; });

  drawBox(svg, CX, ys[0], BW, heights[0], C.purple, 'Coordinator', null, 'orchestrates training');

  topology.forEach((w, i) => {
    const wi  = i + 1;
    const col = w.is_last ? C.orange : C.blue;
    const sub = w.is_last ? 'last slice · computes loss' : (w.next ? `→ ${w.next.split(':')[0]}` : '');
    drawBox(svg, CX, ys[wi], BW, heights[wi], col, w.hostname, w.layers, sub);

    const prevBottom = ys[wi - 1] + heights[wi - 1];
    const midY       = (prevBottom + ys[wi]) / 2;

    svg.appendChild(el('line', { x1: ARROW_R, y1: prevBottom + 4, x2: ARROW_R, y2: ys[wi] - 4, stroke: C.blue, 'stroke-width': 1.5, 'marker-end': 'url(#mfwd)' }));
    svg.appendChild(el('text', { x: ARROW_R + 5, y: midY + 4, fill: C.blue, 'font-size': 9, 'text-anchor': 'start' }, 'fwd'));
    svg.appendChild(el('line', { x1: ARROW_L, y1: ys[wi] - 4, x2: ARROW_L, y2: prevBottom + 4, stroke: C.orange, 'stroke-width': 1.5, 'stroke-dasharray': '4 2', 'marker-end': 'url(#mbwd)' }));
    svg.appendChild(el('text', { x: ARROW_L - 5, y: midY + 4, fill: C.orange, 'font-size': 9, 'text-anchor': 'end' }, 'bwd'));
  });

  svg.setAttribute('height', y - GAP + 20);
}

function drawBox(svg, cx, y, bw, bh, accent, title, layers, sub) {
  svg.appendChild(el('rect', { x: cx - bw/2, y, width: bw, height: bh, rx: 6, fill: C.surface2, stroke: accent, 'stroke-width': 1.5 }));
  svg.appendChild(el('rect', { x: cx - bw/2 + 1, y: y + 1, width: bw - 2, height: 3, rx: 3, fill: accent, opacity: .35 }));
  svg.appendChild(el('text', { x: cx, y: y + 20, 'text-anchor': 'middle', fill: C.text, 'font-size': 12, 'font-weight': 700 }, title));
  if (sub) svg.appendChild(el('text', { x: cx, y: y + 34, 'text-anchor': 'middle', fill: C.muted, 'font-size': 10 }, sub));
  if (layers?.length) layers.forEach((l, i) => svg.appendChild(el('text', { x: cx, y: y + 50 + i * 14, 'text-anchor': 'middle', fill: accent, 'font-size': 10, 'font-family': C.mono }, l)));
}

// ── Swimlane drawing ──────────────────────────────────────────────────────────
function drawSwimlane(svg, batch, topology) {
  svg.innerHTML = '';
  if (!batch || !topology?.length) {
    svg.appendChild(el('text', { x: '50%', y: '50%', 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: C.muted, 'font-size': 12 }, 'Select a batch to inspect'));
    return;
  }

  const W       = svg.clientWidth  || 700;
  const H       = svg.clientHeight || 180;
  const LABEL_W = 130;
  const chartW  = W - LABEL_W - 12;
  const workers = batch.workers || {};
  const hosts   = topology.map(w => w.hostname);

  let t = 0;
  const timeline = {};
  hosts.forEach(h => { timeline[h] = []; });
  hosts.forEach(h => { const d = (workers[h]||{}).fwd_ms||0; if(d) timeline[h].push({s:t,d,type:'fwd'}); t+=d; });
  [...hosts].reverse().forEach(h => { const d = (workers[h]||{}).bwd_ms||0; if(d) timeline[h].push({s:t,d,type:'bwd'}); t+=d; });

  const totalMs = Math.max(t, batch.total_ms || 1);
  const scale   = chartW / totalMs;
  const rows    = [{ key: 'coordinator', label: 'Coordinator' }, ...hosts.map(h => ({ key: h, label: h.length > 16 ? h.slice(0, 14) + '…' : h }))];
  const ROW_H   = Math.max(42, Math.floor((H - 26) / rows.length));
  const TOP     = 22;

  const defs = el('defs');
  defs.innerHTML = `<clipPath id="sw-clip"><rect x="${LABEL_W}" y="0" width="${chartW}" height="${H}"/></clipPath>`;
  svg.appendChild(defs);

  const TICKS = 6;
  for (let i = 0; i <= TICKS; i++) {
    const x = LABEL_W + (i / TICKS) * chartW;
    svg.appendChild(el('line', { x1: x, y1: TOP - 5, x2: x, y2: TOP + rows.length * ROW_H, stroke: '#21262d', 'stroke-width': 1 }));
    svg.appendChild(el('text', { x, y: TOP - 7, 'text-anchor': 'middle', fill: C.muted, 'font-size': 9 }, `${Math.round(i / TICKS * totalMs)}ms`));
  }

  rows.forEach((row, ri) => {
    const ry = TOP + ri * ROW_H;
    svg.appendChild(el('text', { x: LABEL_W - 8, y: ry + ROW_H/2 + 4, 'text-anchor': 'end', fill: C.muted, 'font-size': 10, 'font-family': C.mono }, row.label));
    svg.appendChild(el('rect', { x: LABEL_W, y: ry + 2, width: chartW, height: ROW_H - 4, fill: '#161b22', rx: 3 }));

    if (row.key === 'coordinator') {
      const bw = Math.max((batch.total_ms || 0) * scale, 4);
      const bx = LABEL_W, by = ry + 4, bh = ROW_H - 8;
      svg.appendChild(el('rect', { x: bx, y: by, width: bw, height: bh, fill: C.purple, opacity: .22, rx: 3 }));
      if (bw > 100) {
        svg.appendChild(el('text', { x: bx + bw/2, y: by + bh/2 - 3, 'text-anchor': 'middle', fill: C.purple, 'font-size': 9, 'font-weight': 700, 'font-family': C.mono }, `E${batch.epoch}  B${batch.batch_id}  ${batch.total_ms}ms`));
        svg.appendChild(el('text', { x: bx + bw/2, y: by + bh/2 + 10, 'text-anchor': 'middle', fill: C.purple, 'font-size': 8, 'font-family': C.mono }, `loss ${batch.loss?.toFixed(4)}`));
      } else if (bw > 30) {
        svg.appendChild(el('text', { x: bx + bw/2, y: by + bh/2 + 4, 'text-anchor': 'middle', fill: C.purple, 'font-size': 9 }, `${batch.total_ms}ms`));
      }
    } else {
      (timeline[row.key] || []).forEach(seg => {
        const bx = LABEL_W + seg.s * scale;
        const bw = Math.max(seg.d * scale, 2);
        const by = ry + 4, bh = ROW_H - 8;
        const fill = seg.type === 'fwd' ? C.blue : C.orange;
        const g = el('g', { 'clip-path': 'url(#sw-clip)' });
        g.appendChild(el('rect', { x: bx, y: by, width: bw, height: bh, fill, opacity: .9, rx: 3 }));
        if (bw > 120) {
          g.appendChild(el('text', { x: bx + bw/2, y: by + bh/2 - 3, 'text-anchor': 'middle', fill: '#0d1117', 'font-size': 9, 'font-weight': 700, 'font-family': C.mono }, `${seg.type === 'fwd' ? 'Forward' : 'Backward'}  ${seg.d}ms`));
          g.appendChild(el('text', { x: bx + bw/2, y: by + bh/2 + 10, 'text-anchor': 'middle', fill: '#0d1117', 'font-size': 8, 'font-family': C.mono }, `E${batch.epoch}  B${batch.batch_id}`));
        } else if (bw > 40) {
          g.appendChild(el('text', { x: bx + bw/2, y: by + bh/2 + 4, 'text-anchor': 'middle', fill: '#0d1117', 'font-size': 9, 'font-weight': 700 }, `${seg.d}ms`));
        }
        svg.appendChild(g);
      });
    }
  });
}

// ── Topology panel ────────────────────────────────────────────────────────────
function TopologyPanel({ topology }) {
  const svgRef = useRef(null);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!svgRef.current) return;
    const W = wrapRef.current?.clientWidth || 220;
    drawTopology(svgRef.current, topology || [], W);
  }, [topology]);

  return (
    <div style={{ width: 244, borderRight: `1px solid ${C.border}`, display: 'flex', flexDirection: 'column', flexShrink: 0 }}>
      <div style={{ padding: '10px 14px 8px', ...panelTitle, marginBottom: 0, borderBottom: `1px solid ${C.border}` }}>Topology</div>
      <div ref={wrapRef} style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', padding: '8px 4px 8px 6px' }}>
        <svg ref={svgRef} width="100%" style={{ overflow: 'visible', display: 'block' }} />
      </div>
    </div>
  );
}

// ── Header ────────────────────────────────────────────────────────────────────
function Header({ connected, lastUpdate, epochs, batches }) {
  const lastEpoch = epochs[epochs.length - 1];
  const lastBatch = batches[batches.length - 1];

  return (
    <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: '0 20px', height: 46, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
      <span style={{ fontWeight: 700, fontSize: 15, letterSpacing: '.03em' }}>
        Torch<span style={{ color: C.blue }}>Slicer</span> Monitor
      </span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 28 }}>
        {lastEpoch && <StatChip label="epoch"     value={`${lastEpoch.epoch}`}                  color={C.purple} />}
        {lastEpoch && <StatChip label="avg loss"  value={lastEpoch.avg_loss.toFixed(4)}          color={C.yellow} />}
        {lastBatch && <StatChip label="batches"   value={`${batches.length}`}                    color={C.blue}   />}
        {lastBatch && <StatChip label="batch ms"  value={`${lastBatch.total_ms}ms`}              color={C.green}  />}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: connected ? C.green : C.red, boxShadow: connected ? `0 0 8px ${C.green}` : 'none', transition: 'all .4s' }} />
          <span style={{ color: C.muted, fontSize: 11 }}>{connected ? 'live' : 'reconnecting…'}</span>
        </div>
        {lastUpdate && <span style={{ color: C.border, fontSize: 11, fontFamily: C.mono }}>{lastUpdate}</span>}
      </div>
    </div>
  );
}

function StatChip({ label, value, color }) {
  return (
    <div style={{ textAlign: 'center' }}>
      <div style={{ fontSize: 9, color: C.muted, textTransform: 'uppercase', letterSpacing: '.08em' }}>{label}</div>
      <div style={{ fontSize: 13, fontWeight: 700, color, fontFamily: C.mono }}>{value}</div>
    </div>
  );
}

// ── Tab bar ───────────────────────────────────────────────────────────────────
function TabBar({ active, onChange }) {
  return (
    <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, flexShrink: 0, padding: '0 12px' }}>
      {['Training', 'Timeline', 'Batches'].map(t => (
        <button key={t} onClick={() => onChange(t)} style={{
          padding: '10px 16px', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 500, background: 'transparent',
          color: active === t ? C.blue : C.muted,
          borderBottom: `2px solid ${active === t ? C.blue : 'transparent'}`,
          marginBottom: -1,
        }}>
          {t}
        </button>
      ))}
    </div>
  );
}

// ── Tooltip styling ───────────────────────────────────────────────────────────
const ttStyle = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 11 };
const ttLabelStyle = { color: C.muted };

// ── Training tab ──────────────────────────────────────────────────────────────
function EpochLossChart({ epochs }) {
  if (!epochs.length) return <Empty text="Waiting for epoch data…" />;
  return (
    <ResponsiveContainer width="100%" height="100%">
      <LineChart data={epochs} margin={{ top: 12, right: 20, bottom: 20, left: 44 }}>
        <CartesianGrid strokeDasharray="3 3" stroke="#21262d" />
        <XAxis dataKey="epoch" stroke={C.muted} tick={{ fontSize: 10, fill: C.muted }}
          label={{ value: 'Epoch', position: 'insideBottomRight', offset: -8, fill: C.muted, fontSize: 10 }} />
        <YAxis stroke={C.muted} tick={{ fontSize: 10, fill: C.muted }} tickFormatter={v => v.toFixed(3)} />
        <Tooltip contentStyle={ttStyle} labelStyle={ttLabelStyle}
          labelFormatter={v => `Epoch ${v}`}
          formatter={(v, n) => [v.toFixed(4), n === 'avg_loss' ? 'Avg Loss' : 'Batches']} />
        <Legend wrapperStyle={{ fontSize: 10, color: C.muted }} formatter={v => v === 'avg_loss' ? 'Avg Loss' : v} />
        <Brush dataKey="epoch" height={18} stroke={C.border} fill={C.surface} travellerWidth={6} />
        <Line type="monotone" dataKey="avg_loss" stroke={C.green} strokeWidth={2.5}
          dot={{ r: 4, fill: C.green, strokeWidth: 0 }} activeDot={{ r: 6 }} name="avg_loss" />
      </LineChart>
    </ResponsiveContainer>
  );
}

function BatchLossChart({ batches }) {
  if (!batches.length) return <Empty text="Waiting for batch data…" />;
  const data = batches.map((b, i) => ({ idx: i, loss: b.loss, epoch: b.epoch, batch_id: b.batch_id }));
  return (
    <ResponsiveContainer width="100%" height="100%">
      <LineChart data={data} margin={{ top: 12, right: 20, bottom: 20, left: 44 }}>
        <CartesianGrid strokeDasharray="3 3" stroke="#21262d" />
        <XAxis dataKey="idx" stroke={C.muted} tick={{ fontSize: 9, fill: C.muted }}
          label={{ value: 'All batches', position: 'insideBottomRight', offset: -8, fill: C.muted, fontSize: 9 }} />
        <YAxis stroke={C.muted} tick={{ fontSize: 10, fill: C.muted }} tickFormatter={v => v.toFixed(2)} />
        <Tooltip contentStyle={ttStyle} labelStyle={ttLabelStyle}
          labelFormatter={(v, p) => p?.[0] ? `E${p[0].payload.epoch}  B${p[0].payload.batch_id}` : ''}
          formatter={v => [v.toFixed(4), 'Loss']} />
        <Brush dataKey="idx" height={18} stroke={C.border} fill={C.surface} travellerWidth={6} />
        <Line type="monotone" dataKey="loss" stroke={C.yellow} strokeWidth={1.5} dot={false} name="loss" />
      </LineChart>
    </ResponsiveContainer>
  );
}

function WorkerTimingChart({ batches, topology }) {
  const hosts = topology.map(w => w.hostname);
  const short = h => h.length > 10 ? h.slice(0, 8) + '…' : h;

  const data = useMemo(() => hosts.map(h => {
    const vals = batches.map(b => b.workers?.[h]).filter(Boolean);
    const avg  = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
    return {
      name:    short(h),
      Forward: avg(vals.filter(v => v.fwd_ms).map(v => v.fwd_ms)),
      Backward: avg(vals.filter(v => v.bwd_ms).map(v => v.bwd_ms)),
    };
  }), [batches, topology]);

  if (!data.length) return <Empty text="No worker data yet" />;
  return (
    <ResponsiveContainer width="100%" height="100%">
      <BarChart data={data} margin={{ top: 12, right: 20, bottom: 20, left: 44 }}>
        <CartesianGrid strokeDasharray="3 3" stroke="#21262d" />
        <XAxis dataKey="name" stroke={C.muted} tick={{ fontSize: 10, fill: C.muted }} />
        <YAxis stroke={C.muted} tick={{ fontSize: 10, fill: C.muted }} unit="ms" />
        <Tooltip contentStyle={ttStyle} labelStyle={ttLabelStyle} formatter={(v, n) => [`${v}ms`, n]} />
        <Legend wrapperStyle={{ fontSize: 10, color: C.muted }} />
        <Bar dataKey="Forward"  fill={C.blue}   radius={[3, 3, 0, 0]} />
        <Bar dataKey="Backward" fill={C.orange}  radius={[3, 3, 0, 0]} />
      </BarChart>
    </ResponsiveContainer>
  );
}

function TrainingTab({ epochs, batches, topology }) {
  return (
    <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr', gridTemplateRows: '55% 45%', gap: 10, padding: 12, minHeight: 0, overflow: 'hidden' }}>
      <div style={{ ...panel, gridColumn: '1 / 3' }}>
        <div style={panelTitle}>Avg Loss / Epoch</div>
        <EpochLossChart epochs={epochs} />
      </div>
      <div style={panel}>
        <div style={panelTitle}>Per-Batch Loss (all epochs)</div>
        <BatchLossChart batches={batches} />
      </div>
      <div style={panel}>
        <div style={panelTitle}>Worker Timing (avg fwd / bwd)</div>
        <WorkerTimingChart batches={batches} topology={topology} />
      </div>
    </div>
  );
}

// ── Timeline tab ──────────────────────────────────────────────────────────────
function Swimlane({ batch, topology }) {
  const svgRef = useRef(null);
  useEffect(() => { if (svgRef.current) drawSwimlane(svgRef.current, batch, topology); }, [batch, topology]);
  return <svg ref={svgRef} width="100%" height="100%" style={{ display: 'block' }} />;
}

function TimelineTab({ batches, topology, jumpBatchId, onJumpConsumed }) {
  const epochs = useMemo(() => [...new Set(batches.map(b => b.epoch))].sort((a, b) => a - b), [batches]);
  const [filterEpoch, setFilterEpoch] = useState(null);
  const [selectedId, setSelectedId]   = useState(null);

  // Consume batch jump from Batches tab
  useEffect(() => {
    if (jumpBatchId != null) { setSelectedId(jumpBatchId); onJumpConsumed?.(); }
  }, [jumpBatchId]);

  // Default to latest
  useEffect(() => {
    if (selectedId == null && batches.length) setSelectedId(batches[batches.length - 1].batch_id);
  }, [batches]);

  const filtered = useMemo(() =>
    filterEpoch != null ? batches.filter(b => b.epoch === filterEpoch) : batches,
    [batches, filterEpoch]);

  const batch = useMemo(() =>
    batches.find(b => b.batch_id === selectedId) || batches[batches.length - 1],
    [batches, selectedId]);

  const selStyle = { background: C.surface, color: C.text, border: `1px solid ${C.border}`, borderRadius: 5, padding: '4px 10px', fontSize: 11, cursor: 'pointer' };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10, padding: 12, minHeight: 0, overflow: 'hidden' }}>
      {/* Controls */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0, flexWrap: 'wrap' }}>
        <label style={{ color: C.muted, fontSize: 11 }}>Epoch</label>
        <select value={filterEpoch ?? ''} onChange={e => setFilterEpoch(e.target.value ? +e.target.value : null)} style={selStyle}>
          <option value="">All</option>
          {epochs.map(e => <option key={e} value={e}>Epoch {e}</option>)}
        </select>
        <label style={{ color: C.muted, fontSize: 11 }}>Batch</label>
        <select value={selectedId ?? ''} onChange={e => setSelectedId(+e.target.value)} style={{ ...selStyle, maxWidth: 280 }}>
          {filtered.map(b => (
            <option key={b.batch_id} value={b.batch_id}>
              E{b.epoch}  B{b.batch_id}  —  loss {b.loss?.toFixed(4)}  ({b.total_ms}ms)
            </option>
          ))}
        </select>
        {batch && (
          <span style={{ color: C.muted, fontSize: 11, marginLeft: 'auto' }}>
            Total: <strong style={{ color: C.green }}>{batch.total_ms}ms</strong>
            &nbsp;·&nbsp;Loss: <strong style={{ color: C.yellow }}>{batch.loss?.toFixed(4)}</strong>
          </span>
        )}
      </div>
      {/* Swimlane */}
      <div style={{ ...panel, flex: 1 }}>
        <div style={panelTitle}>Forward &amp; Backward Flow</div>
        <div style={{ flex: 1, minHeight: 0 }}>
          <Swimlane batch={batch} topology={topology} />
        </div>
      </div>
    </div>
  );
}

// ── Batches tab ───────────────────────────────────────────────────────────────
function BatchesTab({ batches, topology, onSelectBatch }) {
  const hosts  = topology.map(w => w.hostname);
  const short  = h => h.length > 8 ? h.slice(0, 7) + '…' : h;
  const epochs = useMemo(() => [...new Set(batches.map(b => b.epoch))].sort((a, b) => a - b), [batches]);

  const [filterEpoch, setFilterEpoch] = useState(null);
  const [sortKey, setSortKey]         = useState('batch_id');
  const [sortDir, setSortDir]         = useState(-1);

  function toggleSort(k) {
    if (sortKey === k) setSortDir(d => -d);
    else { setSortKey(k); setSortDir(-1); }
  }

  const rows = useMemo(() => {
    let list = filterEpoch != null ? batches.filter(b => b.epoch === filterEpoch) : [...batches];
    list.sort((a, b) => {
      let av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
      return sortDir * (av < bv ? -1 : av > bv ? 1 : 0);
    });
    return list;
  }, [batches, filterEpoch, sortKey, sortDir]);

  const TH = ({ k, children }) => (
    <th onClick={() => toggleSort(k)} style={{
      padding: '5px 10px', textAlign: 'left', fontSize: 10, fontWeight: 500, whiteSpace: 'nowrap',
      color: sortKey === k ? C.blue : C.muted, background: C.surface,
      position: 'sticky', top: 0, zIndex: 2, cursor: 'pointer', userSelect: 'none',
      boxShadow: `0 1px 0 ${C.border}`,
    }}>
      {children}{sortKey === k ? (sortDir < 0 ? ' ↓' : ' ↑') : ''}
    </th>
  );

  const selStyle = { background: C.surface, color: C.text, border: `1px solid ${C.border}`, borderRadius: 5, padding: '4px 10px', fontSize: 11, cursor: 'pointer' };

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10, padding: 12, minHeight: 0, overflow: 'hidden' }}>
      {/* Filter bar */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
        <label style={{ color: C.muted, fontSize: 11 }}>Epoch:</label>
        <select value={filterEpoch ?? ''} onChange={e => setFilterEpoch(e.target.value ? +e.target.value : null)} style={selStyle}>
          <option value="">All epochs</option>
          {epochs.map(e => <option key={e} value={e}>Epoch {e}</option>)}
        </select>
        <span style={{ color: C.muted, fontSize: 11, marginLeft: 'auto' }}>
          {rows.length} <span style={{ color: C.border }}>batches</span>
          &nbsp;·&nbsp;Click a row to inspect its swimlane
        </span>
      </div>
      {/* Table */}
      <div style={{ flex: 1, overflowY: 'auto', minHeight: 0, border: `1px solid ${C.border}`, borderRadius: 6 }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: C.mono, fontSize: 11 }}>
          <thead>
            <tr>
              <TH k="epoch">Epoch</TH>
              <TH k="batch_id">Batch</TH>
              <TH k="loss">Loss</TH>
              <TH k="total_ms">Total ms</TH>
              {hosts.map(h => (
                <React.Fragment key={h}>
                  <TH k={h + '_fwd'}>{short(h)} fwd</TH>
                  <TH k={h + '_bwd'}>{short(h)} bwd</TH>
                </React.Fragment>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(b => (
              <tr key={b.batch_id} onClick={() => onSelectBatch(b.batch_id)}
                style={{ cursor: 'pointer' }}
                onMouseEnter={e => e.currentTarget.style.background = 'rgba(88,166,255,.06)'}
                onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                <td style={{ padding: '4px 10px', color: C.purple,  borderBottom: `1px solid rgba(48,54,61,.35)` }}>{b.epoch}</td>
                <td style={{ padding: '4px 10px',                    borderBottom: `1px solid rgba(48,54,61,.35)` }}>{b.batch_id}</td>
                <td style={{ padding: '4px 10px', color: C.yellow,  borderBottom: `1px solid rgba(48,54,61,.35)` }}>{b.loss?.toFixed(4)}</td>
                <td style={{ padding: '4px 10px', color: b.total_ms > 500 ? C.red : C.green, borderBottom: `1px solid rgba(48,54,61,.35)` }}>{b.total_ms}ms</td>
                {hosts.map(h => {
                  const w = b.workers?.[h] || {};
                  return (
                    <React.Fragment key={h}>
                      <td style={{ padding: '4px 10px', color: w.fwd_ms > 100 ? C.red : C.green, borderBottom: `1px solid rgba(48,54,61,.35)` }}>{w.fwd_ms != null ? `${w.fwd_ms}ms` : '—'}</td>
                      <td style={{ padding: '4px 10px', color: w.bwd_ms > 100 ? C.red : C.green, borderBottom: `1px solid rgba(48,54,61,.35)` }}>{w.bwd_ms != null ? `${w.bwd_ms}ms` : '—'}</td>
                    </React.Fragment>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── Misc ──────────────────────────────────────────────────────────────────────
function Empty({ text }) {
  return (
    <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.muted, fontSize: 12 }}>
      {text}
    </div>
  );
}

// ── App root ──────────────────────────────────────────────────────────────────
function App() {
  const { data, connected, lastUpdate } = useWS();
  const [tab, setTab]           = useState('Training');
  const [jumpBatchId, setJump]  = useState(null);

  function handleSelectBatch(bid) {
    setJump(bid);
    setTab('Timeline');
  }

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: C.bg, color: C.text }}>
      <Header connected={connected} lastUpdate={lastUpdate} epochs={data.epochs} batches={data.batches} />
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden', minHeight: 0 }}>
        <TopologyPanel topology={data.topology} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minHeight: 0 }}>
          <TabBar active={tab} onChange={setTab} />
          {tab === 'Training'  && <TrainingTab  epochs={data.epochs}  batches={data.batches}  topology={data.topology} />}
          {tab === 'Timeline'  && <TimelineTab  batches={data.batches} topology={data.topology} jumpBatchId={jumpBatchId} onJumpConsumed={() => setJump(null)} />}
          {tab === 'Batches'   && <BatchesTab   batches={data.batches} topology={data.topology} onSelectBatch={handleSelectBatch} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
