<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TorchSlicer Monitor</title>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --blue:    #58a6ff;
    --orange:  #f0883e;
    --green:   #3fb950;
    --purple:  #bc8cff;
    --red:     #f85149;
    --yellow:  #e3b341;
    --mono:    'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ── header ───────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0; height: 44px;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: .03em; }
  header h1 em { color: var(--blue); font-style: normal; }
  .hdr-right { display: flex; align-items: center; gap: 16px; }
  #stat-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    transition: background .4s;
  }
  #stat-dot.live  { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #stat-dot.err   { background: var(--red); }
  #stat-label { color: var(--muted); font-size: 11px; }
  #stat-time  { color: var(--border); font-size: 11px; font-family: var(--mono); }

  /* ── main grid ─────────────────────────────────────────────── */
  main {
    flex: 1; display: grid; overflow: hidden;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 1fr 1fr 150px;
    gap: 1px; background: var(--border);
  }

  /* ── panels ────────────────────────────────────────────────── */
  .panel {
    background: var(--bg); overflow: hidden;
    display: flex; flex-direction: column; padding: 14px;
  }
  .panel-title {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
    flex-shrink: 0;
  }

  /* topology spans both top rows */
  #topo-panel  { grid-column: 1; grid-row: 1 / 3; overflow-y: auto; overflow-x: hidden; }
  #swim-panel  { grid-column: 2; grid-row: 1; }
  #hist-panel  { grid-column: 2; grid-row: 2; overflow: hidden; }
  #loss-panel  { grid-column: 1 / 3; grid-row: 3; }

  /* ── topology SVG ──────────────────────────────────────────── */
  #topo-svg { width: 100%; display: block; overflow: visible; }

  /* ── history scroll wrapper ────────────────────────────────── */
  .hist-scroll { flex: 1; overflow-y: auto; min-height: 0; }

  /* ── swimlane ──────────────────────────────────────────────── */
  #swim-panel { padding-bottom: 8px; }
  .legend {
    display: flex; gap: 14px; margin-bottom: 10px; flex-shrink: 0;
  }
  .leg-item { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
  .leg-dot  { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  #swim-svg { flex: 1; width: 100%; display: block; min-height: 0; }

  /* ── history table ─────────────────────────────────────────── */
  table  { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  thead  { position: sticky; top: 0; z-index: 2; }
  th     { padding: 4px 10px; text-align: left; color: var(--muted); font-size: 10px;
           font-weight: 500; background: var(--bg); border-bottom: 1px solid var(--border);
           box-shadow: 0 1px 0 var(--border); }
  td     { padding: 3px 10px; border-bottom: 1px solid rgba(48,54,61,.35); }
  tr:hover td { background: rgba(88,166,255,.04); }
  tr:last-child td { border-bottom: none; }
  .c-ep  { color: var(--purple); }
  .c-ms  { color: var(--green); }
  .c-slw { color: var(--red); }
  .c-ls  { color: var(--yellow); }

  /* ── loss chart ────────────────────────────────────────────── */
  #loss-panel { flex-direction: row; gap: 16px; align-items: stretch; }
  #loss-panel .panel-title { writing-mode: initial; margin-bottom: 0; margin-right: 4px; align-self: flex-start; }
  #loss-svg { flex: 1; display: block; height: 100%; }
</style>
</head>
<body>

<header>
  <h1>Torch<em>Slicer</em> Monitor</h1>
  <div class="hdr-right">
    <div id="stat-time"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="stat-dot"></span>
      <span id="stat-label">connecting…</span>
    </div>
  </div>
</header>

<main>

  <!-- topology -->
  <div class="panel" id="topo-panel">
    <div class="panel-title">Topology</div>
    <svg id="topo-svg">
      <defs>
        <marker id="mfwd" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
          <polygon points="0 0,7 2.5,0 5" fill="#58a6ff"/>
        </marker>
        <marker id="mbwd" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
          <polygon points="0 0,7 2.5,0 5" fill="#f0883e"/>
        </marker>
      </defs>
      <g id="topo-g">
        <text x="50%" y="50%" text-anchor="middle" fill="#8b949e" font-size="12">Waiting…</text>
      </g>
    </svg>
  </div>

  <!-- swimlane -->
  <div class="panel" id="swim-panel">
    <div class="panel-title">Latest Batch — Forward &amp; Backward Flow</div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--purple);opacity:.5"></div>Coordinator</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div>Forward</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--orange)"></div>Backward</div>
    </div>
    <svg id="swim-svg">
      <g id="swim-g">
        <text x="50%" y="50%" text-anchor="middle" fill="#8b949e" font-size="12">Waiting…</text>
      </g>
    </svg>
  </div>

  <!-- history -->
  <div class="panel" id="hist-panel">
    <div class="panel-title">Batch History</div>
    <div class="hist-scroll">
      <table><thead><tr id="t-head"></tr></thead><tbody id="t-body"></tbody></table>
    </div>
  </div>

  <!-- loss -->
  <div class="panel" id="loss-panel">
    <div class="panel-title">Avg Loss / Epoch</div>
    <svg id="loss-svg">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#3fb950" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g id="loss-g">
        <text x="50%" y="50%" text-anchor="middle" fill="#8b949e" font-size="12">Waiting…</text>
      </g>
    </svg>
  </div>

</main>

<script>
const SVG = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

function svgEl(tag, attrs, text) {
  const e = document.createElementNS(SVG, tag);
  for (const [k,v] of Object.entries(attrs||{})) e.setAttribute(k,v);
  if (text != null) e.textContent = text;
  return e;
}

// ── WebSocket ──────────────────────────────────────────────────────────────
let state = null;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen  = () => { $('stat-dot').className='live'; $('stat-label').textContent='live'; };
  ws.onmessage = e => {
    state = JSON.parse(e.data);
    $('stat-time').textContent = new Date().toLocaleTimeString();
    render(state);
  };
  ws.onerror = () => { $('stat-dot').className='err'; $('stat-label').textContent='error'; };
  ws.onclose = () => {
    $('stat-dot').className='';
    $('stat-label').textContent='reconnecting…';
    setTimeout(connect, 3000);
  };
}
connect();

// ── topology ───────────────────────────────────────────────────────────────
function renderTopology(topology) {
  const g = $('topo-g');
  g.innerHTML = '';
  if (!topology.length) {
    g.appendChild(svgEl('text',{x:'50%',y:'50%','text-anchor':'middle',fill:'#8b949e','font-size':12},'Waiting for workers…'));
    return;
  }

  const svg  = $('topo-svg');
  const rect = svg.getBoundingClientRect();
  const W    = rect.width  || 260;

  // Leave 44px on each side for arrow labels so "fwd"/"bwd" never clip
  const BW     = Math.min(W - 88, 180);
  const BH_MIN = 72;
  const LH     = 14;    // per-layer line height
  const GAP    = 56;    // vertical gap between boxes
  const CX     = W / 2;
  const ARROW_X_R = CX + BW / 2 + 14;   // right arrow X
  const ARROW_X_L = CX - BW / 2 - 14;   // left arrow X

  // Compute heights
  const allNodes = [null, ...topology];  // null = coordinator slot
  const heights  = allNodes.map((w,i) =>
    i === 0 ? BH_MIN : BH_MIN + Math.max(0, w.layers.length - 2) * LH
  );

  // Y positions (top edge of each box)
  const ys = [];
  let y = 20;
  heights.forEach(h => { ys.push(y); y += h + GAP; });

  // Set SVG height so topo-panel can scroll when many workers
  const totalH = y - GAP + 20;
  svg.setAttribute('height', totalH);

  // ── draw coordinator ──────────────────────────────────────────
  drawBox(g, CX, ys[0], BW, heights[0], '#bc8cff', 'Coordinator', null, 'orchestrates training loop');

  // ── draw workers + arrows ─────────────────────────────────────
  topology.forEach((w, i) => {
    const wi  = i + 1;
    const bx  = CX - BW / 2;
    const by  = ys[wi];
    const bh  = heights[wi];
    const col = w.is_last ? '#f0883e' : '#58a6ff';
    const sub = w.is_last ? 'last slice — computes loss' : (w.next ? `→ ${w.next.split(':')[0]}` : '');
    drawBox(g, CX, by, BW, bh, col, w.hostname, w.layers, sub);

    // gap space: from bottom of previous box to top of this box
    const prevBottom = ys[wi - 1] + heights[wi - 1];
    const midY       = (prevBottom + by) / 2;

    // Forward arrow: right side, downward
    g.appendChild(svgEl('line', {
      x1: ARROW_X_R, y1: prevBottom + 4,
      x2: ARROW_X_R, y2: by - 4,
      stroke: '#58a6ff', 'stroke-width': 1.5,
      'marker-end': 'url(#mfwd)'
    }));
    g.appendChild(svgEl('text', {
      x: ARROW_X_R + 5, y: midY + 4,
      fill: '#58a6ff', 'font-size': 9,
      'text-anchor': 'start'
    }, 'fwd'));

    // Backward arrow: left side, upward
    g.appendChild(svgEl('line', {
      x1: ARROW_X_L, y1: by - 4,
      x2: ARROW_X_L, y2: prevBottom + 4,
      stroke: '#f0883e', 'stroke-width': 1.5,
      'stroke-dasharray': '4 2',
      'marker-end': 'url(#mbwd)'
    }));
    g.appendChild(svgEl('text', {
      x: ARROW_X_L - 5, y: midY + 4,
      fill: '#f0883e', 'font-size': 9,
      'text-anchor': 'end'
    }, 'bwd'));
  });
}

function drawBox(g, cx, y, bw, bh, accent, title, layers, sub) {
  // Background rect
  g.appendChild(svgEl('rect', {
    x: cx - bw/2, y, width: bw, height: bh,
    rx: 6, ry: 6, fill: '#161b22', stroke: accent, 'stroke-width': 1.5
  }));
  // Accent top bar
  g.appendChild(svgEl('rect', {
    x: cx - bw/2 + 1, y: y + 1, width: bw - 2, height: 3,
    rx: 3, ry: 3, fill: accent, opacity: .35
  }));
  // Title
  g.appendChild(svgEl('text', {
    x: cx, y: y + 20, 'text-anchor': 'middle',
    fill: '#e6edf3', 'font-size': 12, 'font-weight': 700
  }, title));
  // Sub
  if (sub) g.appendChild(svgEl('text', {
    x: cx, y: y + 34, 'text-anchor': 'middle',
    fill: '#8b949e', 'font-size': 10
  }, sub));
  // Layers
  if (layers && layers.length) {
    layers.forEach((l, i) => g.appendChild(svgEl('text', {
      x: cx, y: y + 50 + i * 14, 'text-anchor': 'middle',
      fill: accent, 'font-size': 10, 'font-family': "'SF Mono', monospace"
    }, l)));
  }
}

// ── swimlane ───────────────────────────────────────────────────────────────
function renderSwimlane(batches, topology) {
  const g = $('swim-g');
  g.innerHTML = '';

  const batch = batches[batches.length - 1];
  if (!batch) {
    g.appendChild(svgEl('text',{x:'50%',y:'50%','text-anchor':'middle',fill:'#8b949e','font-size':12},'Waiting…'));
    return;
  }

  const svg     = $('swim-svg');
  const rect    = svg.getBoundingClientRect();
  const W       = rect.width  || 700;
  const H       = rect.height || 120;
  const LABEL_W = 110;
  const chartW  = W - LABEL_W - 12;
  const workers = batch.workers || {};
  const hosts   = topology.map(w => w.hostname);

  // Build serial timing model
  let t = 0;
  const timeline = {};
  hosts.forEach(h => { timeline[h] = []; });

  hosts.forEach(h => {
    const d = (workers[h]||{}).fwd_ms || 0;
    if (d) { timeline[h].push({s: t, d, type:'fwd'}); }
    t += d;
  });
  [...hosts].reverse().forEach(h => {
    const d = (workers[h]||{}).bwd_ms || 0;
    if (d) { timeline[h].push({s: t, d, type:'bwd'}); }
    t += d;
  });

  const totalMs = Math.max(t, batch.total_ms || 1);
  const scale   = chartW / totalMs;

  // All rows
  const rows = [
    { key: 'coordinator', label: 'Coordinator' },
    ...hosts.map(h => ({ key: h, label: h.length > 14 ? h.slice(0,12)+'…' : h }))
  ];
  const ROW_H   = Math.max(40, Math.floor((H - 24) / rows.length));
  const TOP     = 18;

  // Helper: draw 1 or 2 lines of text centred in a bar
  function barText(bx, by, bw, bh, lines, color) {
    if (lines.length === 1) {
      g.appendChild(svgEl('text', {
        x: bx + bw/2, y: by + bh/2 + 4,
        'text-anchor':'middle', fill: color, 'font-size':9, 'font-weight':600,
        'font-family':"'SF Mono', monospace"
      }, lines[0]));
    } else {
      const mid = by + bh/2;
      lines.forEach((line, i) => {
        g.appendChild(svgEl('text', {
          x: bx + bw/2, y: mid + (i === 0 ? -3 : 10),
          'text-anchor':'middle', fill: color,
          'font-size': i === 0 ? 9 : 8,
          'font-weight': i === 0 ? 700 : 400,
          'font-family':"'SF Mono', monospace"
        }, line));
      });
    }
  }

  // Axis ticks
  const TICKS = 5;
  for (let i = 0; i <= TICKS; i++) {
    const x = LABEL_W + (i / TICKS) * chartW;
    g.appendChild(svgEl('line', { x1:x, y1:TOP-4, x2:x, y2:TOP + rows.length * ROW_H + 2, stroke:'#21262d', 'stroke-width':1 }));
    g.appendChild(svgEl('text', { x, y:TOP-6, 'text-anchor':'middle', fill:'#8b949e', 'font-size':9 },
      `${Math.round(i/TICKS*totalMs)}ms`));
  }

  rows.forEach((row, ri) => {
    const ry = TOP + ri * ROW_H;

    // Label
    g.appendChild(svgEl('text', {
      x: LABEL_W - 8, y: ry + ROW_H/2 + 4,
      'text-anchor': 'end', fill: '#8b949e', 'font-size': 10,
      'font-family': "'SF Mono', monospace"
    }, row.label));

    // Row bg
    g.appendChild(svgEl('rect', { x: LABEL_W, y: ry + 2, width: chartW, height: ROW_H - 4, fill: '#161b22', rx:3, ry:3 }));

    if (row.key === 'coordinator') {
      const bw = Math.max((batch.total_ms||0) * scale, 4);
      const bx = LABEL_W, by = ry + 4, bh = ROW_H - 8;
      g.appendChild(svgEl('rect', { x:bx, y:by, width:bw, height:bh, fill:'#bc8cff', opacity:.25, rx:3, ry:3 }));
      if (bw > 90) {
        barText(bx, by, bw, bh, [
          `E${batch.epoch}  B${batch.batch_id}  ${batch.total_ms}ms`,
          `loss ${batch.loss.toFixed(4)}`
        ], '#bc8cff');
      } else if (bw > 40) {
        barText(bx, by, bw, bh, [`${batch.total_ms}ms`], '#bc8cff');
      }
    } else {
      (timeline[row.key]||[]).forEach(seg => {
        const x  = LABEL_W + seg.s * scale;
        const bw = Math.max(seg.d * scale, 2);
        const bx = x, by = ry + 4, bh = ROW_H - 8;
        const isFwd = seg.type === 'fwd';
        const fill  = isFwd ? '#58a6ff' : '#f0883e';
        g.appendChild(svgEl('rect', { x:bx, y:by, width:bw, height:bh, fill, opacity:.88, rx:3, ry:3 }));

        if (bw > 120) {
          barText(bx, by, bw, bh, [
            `${isFwd ? 'Forward' : 'Backward'}  ${seg.d}ms`,
            `E${batch.epoch}  B${batch.batch_id}`
          ], '#0d1117');
        } else if (bw > 50) {
          barText(bx, by, bw, bh, [`${isFwd ? 'fwd' : 'bwd'}  ${seg.d}ms`], '#0d1117');
        } else if (bw > 22) {
          barText(bx, by, bw, bh, [`${seg.d}ms`], '#0d1117');
        }
      });
    }
  });
}

// ── history table ──────────────────────────────────────────────────────────
function renderTable(batches, topology) {
  const hosts = topology.map(w => w.hostname);
  const short = h => h.length > 10 ? h.slice(0,8)+'…' : h;

  let hh = '<th>Epoch</th><th>Batch</th><th>Loss</th><th>Total</th>';
  hosts.forEach(h => { hh += `<th>${short(h)} fwd</th><th>${short(h)} bwd</th>`; });
  $('t-head').innerHTML = hh;

  $('t-body').innerHTML = [...batches].reverse().map(b => {
    const wCells = hosts.map(h => {
      const w = (b.workers||{})[h]||{};
      const f = w.fwd_ms != null ? `<td class="${w.fwd_ms>20?'c-slw':'c-ms'}">${w.fwd_ms}ms</td>` : '<td>—</td>';
      const bk= w.bwd_ms != null ? `<td class="${w.bwd_ms>20?'c-slw':'c-ms'}">${w.bwd_ms}ms</td>` : '<td>—</td>';
      return f + bk;
    }).join('');
    return `<tr>
      <td class="c-ep">${b.epoch}</td>
      <td>${b.batch_id}</td>
      <td class="c-ls">${b.loss.toFixed(4)}</td>
      <td class="${b.total_ms>100?'c-slw':'c-ms'}">${b.total_ms}ms</td>
      ${wCells}
    </tr>`;
  }).join('');
}

// ── loss chart ─────────────────────────────────────────────────────────────
function renderLoss(epochs) {
  const g = $('loss-g');
  g.innerHTML = '';

  if (!epochs.length) {
    g.appendChild(svgEl('text',{x:'50%',y:'50%','text-anchor':'middle',fill:'#8b949e','font-size':12},'No epoch data yet'));
    return;
  }

  const svg  = $('loss-svg');
  const rect = svg.getBoundingClientRect();
  const W    = rect.width  || 600;
  const H    = rect.height || 130;
  const P    = { t:14, r:16, b:28, l:46 };
  const cW   = W - P.l - P.r;
  const cH   = H - P.t - P.b;

  const losses = epochs.map(e => e.avg_loss);
  const minL   = losses.length > 1 ? Math.min(...losses) * 0.97 : 0;
  const maxL   = Math.max(...losses) * 1.03;

  const xS = i => P.l + (epochs.length < 2 ? cW/2 : i / (epochs.length-1) * cW);
  const yS = v => P.t + cH - ((v - minL) / (maxL - minL || 1)) * cH;

  // Grid
  [0, .25, .5, .75, 1].forEach(f => {
    const y = P.t + f * cH;
    const v = maxL - f * (maxL - minL);
    g.appendChild(svgEl('line', { x1:P.l, y1:y, x2:W-P.r, y2:y, stroke:'#21262d', 'stroke-width':1 }));
    g.appendChild(svgEl('text', { x:P.l-4, y:y+3, 'text-anchor':'end', fill:'#8b949e', 'font-size':9 }, v.toFixed(3)));
  });

  // X labels
  epochs.forEach((e, i) => g.appendChild(svgEl('text', {
    x: xS(i), y: H-P.b+12, 'text-anchor':'middle', fill:'#8b949e', 'font-size':9
  }, `E${e.epoch}`)));

  if (epochs.length === 1) {
    g.appendChild(svgEl('circle',{cx:xS(0),cy:yS(losses[0]),r:4,fill:'#3fb950'}));
    return;
  }

  // Area
  const pts = epochs.map((e,i) => `${xS(i)},${yS(losses[i])}`);
  const area = document.createElementNS(SVG,'path');
  area.setAttribute('d', `M${pts.join(' L')} L${xS(epochs.length-1)},${P.t+cH} L${xS(0)},${P.t+cH} Z`);
  area.setAttribute('fill','url(#lg)');
  g.appendChild(area);

  // Line
  const poly = document.createElementNS(SVG,'polyline');
  poly.setAttribute('points', pts.join(' '));
  poly.setAttribute('fill','none');
  poly.setAttribute('stroke','#3fb950');
  poly.setAttribute('stroke-width','2');
  poly.setAttribute('stroke-linejoin','round');
  g.appendChild(poly);

  // Dots + value labels
  epochs.forEach((e,i) => {
    const x = xS(i), y = yS(losses[i]);
    g.appendChild(svgEl('circle',{cx:x, cy:y, r:3, fill:'#3fb950'}));
    g.appendChild(svgEl('text',{x, y:y-6, 'text-anchor':'middle', fill:'#3fb950', 'font-size':9}, losses[i].toFixed(4)));
  });
}

// ── master render ──────────────────────────────────────────────────────────
function render(s) {
  renderTopology(s.topology||[]);
  renderSwimlane(s.batches||[], s.topology||[]);
  renderTable(s.batches||[], s.topology||[]);
  renderLoss(s.epochs||[]);
}

window.addEventListener('resize', () => { if (state) render(state); });
// Give SVGs time to paint before first query
setTimeout(() => { if (state) render(state); }, 100);
</script>
</body>
</html>
