# TinyGPT LM — P2P topology, CPU base (override with docker-compose.lm.gpu.yml for GPU).
#
# Usage (GPU):
#   make run-lm-gpu CONFIG=experiments/tinygpt_2gpu_p2p.yaml
#
# Usage (CPU):
#   make run-lm-cpu CONFIG=experiments/tinygpt_2gpu_p2p.yaml

services:
  lm-worker0:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: lm-worker0
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=true
      - WORKER_INDEX=0
      - WORKER_ADDRESS=lm-worker0:50051
      - WORKER_PEERS=lm-worker0:50051,lm-worker1:50051
      - EXPERIMENT_CONFIG
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/lm/worker/main.py 50051
    networks:
      - torchslicer-lm

  lm-worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: lm-worker1
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=false
      - WORKER_INDEX=1
      - WORKER_ADDRESS=lm-worker1:50051
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/lm/worker/main.py 50051
    networks:
      - torchslicer-lm

networks:
  torchslicer-lm:
    driver: bridge
