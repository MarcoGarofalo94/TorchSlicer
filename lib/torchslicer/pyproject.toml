[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchslicer"
version = "0.2.0"
description = "Split learning framework for PyTorch — pipeline-parallel training across heterogeneous devices."
authors = [{ name = "Marco Garofalo", email = "garofalomarco58@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]
readme = "README.md"
keywords = ["deep-learning", "split-learning", "distributed-training", "pytorch", "pipeline-parallelism"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/MarcoGarofalo94/TorchSlicer"
Repository = "https://github.com/MarcoGarofalo94/TorchSlicer"
"Bug Tracker" = "https://github.com/MarcoGarofalo94/TorchSlicer/issues"

[project.optional-dependencies]
grpc = [
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf",
    "pyyaml",
]
monitor = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
]
peft = ["peft>=0.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["torchslicer*"]
