syntax = "proto3";

package torchslicer.coordinator;

service CoordinatorService {
    rpc batch_done (BatchDoneRequest) returns (Empty);
    rpc report_metrics (MetricsMessage) returns (Empty);
}

message Empty {}

message BatchDoneRequest {
    uint32 batch_id = 1;
}

message MetricsMessage {
    uint32 batch_id = 1;
    float  loss     = 2;
    string worker   = 3;
}
