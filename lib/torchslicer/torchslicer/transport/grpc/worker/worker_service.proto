syntax = "proto3";

package torchslicer.worker;

service WorkerService {
    rpc init             (SliceConfig)      returns (StatusMessage);
    rpc forward          (ForwardRequest)   returns (Ack);
    rpc backward         (BackwardRequest)  returns (Ack);
    rpc shutdown         (ShutdownRequest)  returns (Ack);
    rpc get_stats        (GetStatsRequest)  returns (WorkerStatsResponse);
    rpc save_checkpoint  (ShutdownRequest)  returns (Ack);  // save without stopping server
    rpc tied_grad        (TiedTensor)       returns (Ack);  // replica → owner: gradient of a tied parameter
    rpc tied_update      (TiedTensor)       returns (Ack);  // owner → replica: value after the optimizer step
    rpc describe         (DescribeRequest)  returns (NodeDescription);  // capabilities, for planning
    rpc echo             (EchoRequest)      returns (EchoReply);        // network probe target
    rpc probe_link       (LinkProbeRequest) returns (LinkProbeReply);   // measure this worker → target
    // client nodes (sl.client_nodes, M10): a worker holding slice 0 and its own data
    rpc client_info      (ClientInfoRequest) returns (ClientInfo);      // its data, for the schedule
    rpc client_step      (ClientStepRequest) returns (Ack);             // run its next batch as batch_id
    rpc get_state        (StateRequest)     returns (StateBlob);        // slice weights + optimizer state
    rpc set_state        (StateBlob)        returns (Ack);
}

// NAT traversal (torchslicer/transport/tunnel.py). A node that accepts no connections
// opens this stream to a node that does (a peer or a relay); afterwards the callee
// sends its calls to the NAT'd node down the stream instead of dialing it. Every
// TorchSlicer gRPC server (worker, coordinator, tail slice, relay) serves it.
service TunnelService {
    rpc open (stream TunnelFrame) returns (stream TunnelFrame);
}

// ── tensor ────────────────────────────────────────────────────────────────────

enum DType {
    FLOAT32 = 0;
    FLOAT16 = 1;
    BFLOAT16 = 2;
    FLOAT64 = 3;
    INT64   = 4;
    INT32   = 5;
    UINT8   = 6;  // packed cut-hook payloads (torchslicer.sl.hooks.pack_payload)
    INT8    = 7;
    BOOL    = 8;
}

message Tensor {
    bytes        data   = 1;  // raw contiguous buffer (t.numpy().tobytes()); shape+dtype used for reconstruction
    repeated int64 shape = 2;
    DType        dtype  = 3;
}

// ── layer description ─────────────────────────────────────────────────────────

message LayerConfig {
    string layer_type  = 1;  // class name for logging, e.g. "Linear", "Conv2d"
    bytes  serialized  = 2;  // torch.save(layer) — architecture + weights bundled
}

// ── init ──────────────────────────────────────────────────────────────────────

message OptimizerConfig {
    string name = 1;
    float  lr   = 2;
    bytes  extra_params = 3;  // torch.save(dict) for momentum, weight_decay, etc.
}

message CriterionConfig {
    string name         = 1;
    bytes  extra_params = 2;  // torch.save(dict) for label_smoothing, etc.
}

// Encodes one layer's intra-partition predecessor indices (partition-local).
// Empty list means the layer takes the partition's external input.
message PredecessorList {
    repeated int32 indices = 1;
}

message SliceConfig {
    repeated LayerConfig layers    = 1;
    OptimizerConfig      optimizer = 2;
    optional CriterionConfig criterion = 3;  // only set on the last worker
    bool    is_last                = 4;
    string  prev_worker            = 5;  // host:port, empty if first
    string  next_worker            = 6;  // host:port, empty if last
    string  coordinator            = 7;  // host:port
    uint32  n_micro                = 8;  // GPipe micro-batch count; 0/1 = disabled
    string  run_id                 = 9;  // coordinator-assigned run ID; echoed on all batch messages
    string  checkpoint_path        = 10; // non-empty if resuming from checkpoint
    uint32  worker_index           = 11; // 0-based index; used for checkpoint naming
    uint32  profile_verbosity      = 12; // 0=off 1=epoch totals 2=phase breakdown 3=per-batch
    bool    profile_memory         = 13; // capture GPU memory snapshots per phase
    repeated PredecessorList predecessors = 14; // intra-partition DAG; one entry per layer
    repeated TiedParam tied        = 15; // parameters shared with other layers (tied weights)
    string  init_token             = 16; // unique per init round; tied messages from other rounds are dropped
    bytes   cut_hooks              = 17; // torch.save({cut: CutHook}) for this slice's input/output cuts
    uint32  n_slices               = 18; // number of slices in the run (cut hooks' context)
    // client nodes (M10). On slice 1: every client's address, by client index; the client of
    // a batch is (batch_id // n_micro) % len(prev_workers). On a client: the last slice, where
    // it sends its labels.
    repeated string prev_workers   = 19;
    string  label_worker           = 20;
    // A server slice with client nodes: the number of clients, and whether it keeps one copy
    // of itself per client (SplitFed V1), swapped in when a client's batch arrives.
    uint32  n_clients              = 21;
    bool    per_client_state       = 22;
}

// A parameter reachable under several names, possibly on several workers.
// The owner (lowest worker index using it) is the only one that optimizes it.
message TiedParam {
    uint32          group = 1;
    repeated string names = 2;  // local names (SplitLayer-relative) that must share one tensor
    bool            owner = 3;
    repeated string peers = 4;  // owner: replica addresses; replica: [owner address]; empty if local-only
}

// ── forward / backward ────────────────────────────────────────────────────────

message ForwardRequest {
    uint32 batch_id = 1;  // monotonic counter, used to match backward
    Tensor input    = 2;
    Tensor label    = 3;  // only sent to the last worker
    map<string, Tensor> aux_inputs = 4;  // optional extra tensors (multimodal etc.), first worker only
}

message BackwardRequest {
    uint32 batch_id  = 1;
    Tensor gradient  = 2;
}

// ── shutdown ──────────────────────────────────────────────────────────────────

message ShutdownRequest {
    bool   save_checkpoint = 1;  // if true, worker saves slice state before exiting
    string checkpoint_dir  = 2;  // mount path visible to the worker container
    string run_id          = 3;
    uint32 epoch           = 4;  // last completed epoch, for checkpoint naming
    uint32 worker_index    = 5;
}

// ── profiling ─────────────────────────────────────────────────────────────────

message GetStatsRequest {
    string run_id    = 1;
    int32  epoch     = 2;
    int32  verbosity = 3;  // if 0, use the verbosity set at init time
}

// Aggregated statistics for one phase over all batches in an epoch.
message PhaseStats {
    float avg_ms   = 1;
    float min_ms   = 2;
    float max_ms   = 3;
    float p95_ms   = 4;
    float total_ms = 5;
    int32 count    = 6;
    float peak_mem_mb = 7;  // populated only when profile_memory=true
}

// Raw per-batch timing (returned only at verbosity=3).
message BatchStats {
    int32 batch_id    = 1;
    float forward_ms  = 2;
    float backward_ms = 3;
    float optimizer_ms = 4;
    float send_fwd_ms = 5;
    float send_bwd_ms = 6;
    float idle_fwd_ms = 7;
    float idle_bwd_ms = 8;
    float peak_mem_mb = 9;
}

message WorkerStatsResponse {
    int32  worker_index = 1;
    string run_id       = 2;
    int32  epoch        = 3;
    // per-phase aggregates
    PhaseStats forward   = 4;
    PhaseStats backward  = 5;
    PhaseStats optimizer = 6;
    PhaseStats send_fwd  = 7;
    PhaseStats send_bwd  = 8;
    PhaseStats idle_fwd  = 9;
    PhaseStats idle_bwd  = 10;
    // memory summary
    float peak_mem_mb  = 11;
    float end_mem_mb   = 12;
    int32 n_batches    = 13;
    // raw per-batch records (verbosity=3 only)
    repeated BatchStats batches = 14;
    // non-empty if this worker hit a fatal runtime error (lets the coordinator
    // confirm a failure report with the reported worker itself)
    string fatal_error = 15;
    // communication sent by this worker since the last epoch read (always counted):
    // payload bytes on the wire (after cut hooks) and before encoding, per direction
    uint64 bytes_fwd     = 16;  // activations to the next slice
    uint64 bytes_bwd     = 17;  // gradients to the previous slice
    uint64 raw_bytes_fwd = 18;
    uint64 raw_bytes_bwd = 19;
    uint64 msgs_fwd      = 20;
    uint64 msgs_bwd      = 21;
    double compute_ms    = 22;  // forward + backward + optimizer wall time of this slice
    uint64 bytes_label   = 23;  // labels a client node sent to the last slice
    uint64 msgs_label    = 24;
}

// ── client nodes (M10) ────────────────────────────────────────────────────────

message ClientInfoRequest {}

message ClientInfo {
    uint32 n_batches = 1;  // batches per epoch of its loader
    uint64 n_samples = 2;  // its training samples (the dataset size, else n_batches)
}

message ClientStepRequest {
    uint32 batch_id = 1;
    uint32 epoch    = 2;  // a new epoch restarts the loader
    uint32 index    = 3;  // the batch's index in the client's epoch (checked)
}

message StateRequest {
    bool   per_client = 1;  // a server slice's copy for `client` (per_client_state)
    uint32 client     = 2;
}

// torch.save({"model": state_dict, "optimizer": state_dict | None}); loaded weights_only
message StateBlob {
    bytes data          = 1;  // empty: leave the weights as they are
    bool  reset_clients = 2;  // then drop the per-client copies: a new round starts from these
}

// ── tied parameters ───────────────────────────────────────────────────────────

message TiedTensor {
    uint32 group      = 1;
    uint32 batch_id   = 2;  // full-batch id (micro-batch id // n_micro)
    string init_token = 3;
    Tensor tensor     = 4;
}

// ── responses ─────────────────────────────────────────────────────────────────

message Ack {
    uint32 batch_id = 1;
}

message StatusMessage {
    bool   ok      = 1;
    string message = 2;
    string hostname = 3;
}

// ── capabilities (planning) ───────────────────────────────────────────────────

message DescribeRequest {}

message NodeDescription {
    string          device         = 1;
    uint64          memory_mb      = 2;  // available memory on the device
    double          compute_gflops = 3;  // measured (or declared) matmul GFLOP/s
    uint64          max_memory_mb  = 4;  // declared cap; 0 = none
    bool            first_slice    = 5;
    repeated string tags           = 6;
    string          hostname       = 7;
}

message EchoRequest {
    bytes payload = 1;  // ignored; its size is what is being measured
}

message EchoReply {
    uint64 n_bytes = 1;
}

message LinkProbeRequest {
    string target  = 1;  // host:port of the worker to measure
    uint64 n_bytes = 2;
    uint32 repeats = 3;
}

message LinkProbeReply {
    double rtt_ms         = 1;
    double bandwidth_mbps = 2;
    string error          = 3;
}

// ── tunnel (NAT traversal) ────────────────────────────────────────────────────

// One message on a tunnel, in either direction. A REQUEST carries a unary call of
// any TorchSlicer service, serialized exactly as gRPC would send it.
message TunnelFrame {
    enum Kind {
        HELLO    = 0;  // first frame of the dialing side: the addresses it serves
        REQUEST  = 1;
        RESPONSE = 2;
        ERROR    = 3;
        PING     = 4;  // keeps NAT mappings open on an idle tunnel; ignored
    }
    Kind            kind      = 1;
    uint64          call_id   = 2;  // matches a RESPONSE/ERROR to its REQUEST
    string          target    = 3;  // REQUEST: address of the node being called
    string          method    = 4;  // REQUEST: full method name, "/package.Service/method"
    bytes           payload   = 5;  // REQUEST / RESPONSE: the serialized message
    int32           code      = 6;  // ERROR: grpc.StatusCode value
    string          details   = 7;  // ERROR
    repeated string addresses = 8;  // HELLO
    double          timeout_s = 9;  // REQUEST: the caller's deadline; 0 = none
}
