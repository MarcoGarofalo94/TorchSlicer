syntax = "proto3";

package torchslicer.worker;

service WorkerService {
    rpc init             (SliceConfig)      returns (StatusMessage);
    rpc forward          (ForwardRequest)   returns (Ack);
    rpc backward         (BackwardRequest)  returns (Ack);
    rpc shutdown         (ShutdownRequest)  returns (Ack);
    rpc get_stats        (GetStatsRequest)  returns (WorkerStatsResponse);
    rpc save_checkpoint  (ShutdownRequest)  returns (Ack);  // save without stopping server
}

// ── tensor ────────────────────────────────────────────────────────────────────

enum DType {
    FLOAT32 = 0;
    FLOAT16 = 1;
    BFLOAT16 = 2;
    FLOAT64 = 3;
    INT64   = 4;
    INT32   = 5;
}

message Tensor {
    bytes        data   = 1;  // raw contiguous buffer (t.numpy().tobytes()); shape+dtype used for reconstruction
    repeated int64 shape = 2;
    DType        dtype  = 3;
}

// ── layer description ─────────────────────────────────────────────────────────

message LayerConfig {
    string layer_type  = 1;  // class name for logging, e.g. "Linear", "Conv2d"
    bytes  serialized  = 2;  // torch.save(layer) — architecture + weights bundled
}

// ── init ──────────────────────────────────────────────────────────────────────

message OptimizerConfig {
    string name = 1;
    float  lr   = 2;
    bytes  extra_params = 3;  // torch.save(dict) for momentum, weight_decay, etc.
}

message CriterionConfig {
    string name         = 1;
    bytes  extra_params = 2;  // torch.save(dict) for label_smoothing, etc.
}

// Encodes one layer's intra-partition predecessor indices (partition-local).
// Empty list means the layer takes the partition's external input.
message PredecessorList {
    repeated int32 indices = 1;
}

message SliceConfig {
    repeated LayerConfig layers    = 1;
    OptimizerConfig      optimizer = 2;
    optional CriterionConfig criterion = 3;  // only set on the last worker
    bool    is_last                = 4;
    string  prev_worker            = 5;  // host:port, empty if first
    string  next_worker            = 6;  // host:port, empty if last
    string  coordinator            = 7;  // host:port
    uint32  n_micro                = 8;  // GPipe micro-batch count; 0/1 = disabled
    string  run_id                 = 9;  // coordinator-assigned run ID; echoed on all batch messages
    string  checkpoint_path        = 10; // non-empty if resuming from checkpoint
    uint32  worker_index           = 11; // 0-based index; used for checkpoint naming
    uint32  profile_verbosity      = 12; // 0=off 1=epoch totals 2=phase breakdown 3=per-batch
    bool    profile_memory         = 13; // capture GPU memory snapshots per phase
    repeated PredecessorList predecessors = 14; // intra-partition DAG; one entry per layer
}

// ── forward / backward ────────────────────────────────────────────────────────

message ForwardRequest {
    uint32 batch_id = 1;  // monotonic counter, used to match backward
    Tensor input    = 2;
    Tensor label    = 3;  // only sent to the last worker
    map<string, Tensor> aux_inputs = 4;  // optional extra tensors (multimodal etc.), first worker only
}

message BackwardRequest {
    uint32 batch_id  = 1;
    Tensor gradient  = 2;
}

// ── shutdown ──────────────────────────────────────────────────────────────────

message ShutdownRequest {
    bool   save_checkpoint = 1;  // if true, worker saves slice state before exiting
    string checkpoint_dir  = 2;  // mount path visible to the worker container
    string run_id          = 3;
    uint32 epoch           = 4;  // last completed epoch, for checkpoint naming
    uint32 worker_index    = 5;
}

// ── profiling ─────────────────────────────────────────────────────────────────

message GetStatsRequest {
    string run_id    = 1;
    int32  epoch     = 2;
    int32  verbosity = 3;  // if 0, use the verbosity set at init time
}

// Aggregated statistics for one phase over all batches in an epoch.
message PhaseStats {
    float avg_ms   = 1;
    float min_ms   = 2;
    float max_ms   = 3;
    float p95_ms   = 4;
    float total_ms = 5;
    int32 count    = 6;
    float peak_mem_mb = 7;  // populated only when profile_memory=true
}

// Raw per-batch timing (returned only at verbosity=3).
message BatchStats {
    int32 batch_id    = 1;
    float forward_ms  = 2;
    float backward_ms = 3;
    float optimizer_ms = 4;
    float send_fwd_ms = 5;
    float send_bwd_ms = 6;
    float idle_fwd_ms = 7;
    float idle_bwd_ms = 8;
    float peak_mem_mb = 9;
}

message WorkerStatsResponse {
    int32  worker_index = 1;
    string run_id       = 2;
    int32  epoch        = 3;
    // per-phase aggregates
    PhaseStats forward   = 4;
    PhaseStats backward  = 5;
    PhaseStats optimizer = 6;
    PhaseStats send_fwd  = 7;
    PhaseStats send_bwd  = 8;
    PhaseStats idle_fwd  = 9;
    PhaseStats idle_bwd  = 10;
    // memory summary
    float peak_mem_mb  = 11;
    float end_mem_mb   = 12;
    int32 n_batches    = 13;
    // raw per-batch records (verbosity=3 only)
    repeated BatchStats batches = 14;
}

// ── responses ─────────────────────────────────────────────────────────────────

message Ack {
    uint32 batch_id = 1;
}

message StatusMessage {
    bool   ok      = 1;
    string message = 2;
    string hostname = 3;
}
