# HuggingFace GPT-2 fine-tuning via split learning — single container, LocalExecutor.
# GPU override: docker-compose.hf.gpu.yml
#
# Usage:
#   make run-hf-gpu    # GPU
#   make run-hf-cpu    # CPU

services:
  hf-worker:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: hf-worker
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/workspace/.cache/huggingface
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/finetune/hf_gpt2.py
