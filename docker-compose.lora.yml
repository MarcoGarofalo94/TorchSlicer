# TinyGPT + LoRA — P2P topology, CPU base (override with docker-compose.lora.gpu.yml for GPU).
#
# Usage (GPU):
#   make run-lora-gpu CONFIG=experiments/lora_tinygpt_2gpu_p2p.yaml
#
# Usage (CPU):
#   make run-lora-cpu CONFIG=experiments/lora_tinygpt_2gpu_p2p.yaml
#
# LoRA hyperparameters:
#   LORA_R=8 LORA_ALPHA=16   (env vars, defaults shown)

services:
  lora-worker0:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: lora-worker0
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=true
      - WORKER_INDEX=0
      - WORKER_ADDRESS=lora-worker0:50051
      - WORKER_PEERS=lora-worker0:50051,lora-worker1:50051
      - EXPERIMENT_CONFIG
      - LORA_R=${LORA_R:-8}
      - LORA_ALPHA=${LORA_ALPHA:-16}
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/lm/lora_worker/main.py 50051
    networks:
      - torchslicer-lora

  lora-worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: lora-worker1
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=false
      - WORKER_INDEX=1
      - WORKER_ADDRESS=lora-worker1:50051
      - EXPERIMENT_CONFIG
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/lm/lora_worker/main.py 50051
    networks:
      - torchslicer-lora

networks:
  torchslicer-lora:
    driver: bridge
