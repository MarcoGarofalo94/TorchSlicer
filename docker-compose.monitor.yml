# Monitoring overlay — adds Jaeger (trace storage) + custom dashboard.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitor.yml up --build
#
# Dashboard: http://localhost:8080
# Jaeger UI (raw):  http://localhost:16686  (optional / for debugging)

services:
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - torchslicer-net

  dashboard:
    build:
      context: examples/monitor
      dockerfile: Dockerfile
    container_name: dashboard
    restart: on-failure
    environment:
      - PYTHONUNBUFFERED=1
      - JAEGER_HTTP=http://jaeger:16686
      - DASHBOARD_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - jaeger
    networks:
      - torchslicer-net

  coordinator:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=torchslicer-coordinator
    depends_on:
      - jaeger

  worker1:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=torchslicer-worker

  worker2:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=torchslicer-worker
