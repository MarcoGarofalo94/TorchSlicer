name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyTorch is intentionally not a declared dependency: install the CPU build explicitly.
      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # Install the published package (lib/torchslicer/pyproject.toml), not the dev one,
      # so packaging problems surface here before a release tag.
      - name: Install torchslicer
        run: pip install "./lib/torchslicer[grpc,flower]" "flwr[simulation]>=1.40" pytest   # Ray: Flower engine test

      - name: Run tests
        run: python -m pytest tests/ -q
