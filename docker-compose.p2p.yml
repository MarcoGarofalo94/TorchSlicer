# P2P topology — no coordinator process.
#
# Worker 0 (driver): owns the DataLoader, builds the model, distributes slices, drives training.
# Worker 1..N (followers): wait for init() from driver, serve forward/backward RPCs.
#
# Quick start (CPU, 2 workers):
#   make run-p2p CONFIG=experiments/resnet18_2gpu_p2p.yaml
#
# Quick start (GPU, 2 workers):
#   make run-p2p DEVICE=gpu CONFIG=experiments/resnet18_2gpu_p2p.yaml
#
# To add workers: extend WORKER_PEERS and add worker2, worker3, ... services below
# following the same pattern as worker1.  Update discovery.peers in the YAML config.
#
# See docker-compose.gpu.yml for NVIDIA device reservations (required for DEVICE=cuda).

services:
  worker0:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.${IMAGE_TAG:-cpu}
    image: torchslicer:${IMAGE_TAG:-cpu}
    container_name: p2p-worker0
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=true
      - WORKER_INDEX=0
      - WORKER_ADDRESS=worker0:50051
      - WORKER_PEERS=worker0:50051,worker1:50051
      - EXPERIMENT_CONFIG
      - RUN_ID
      - EPOCHS
      - USE_GPIPE
      - N_MICRO
      - MIXED_PRECISION
      - LOG_ENABLED
      - LOG_DIR
      - PROFILE_VERBOSITY
      - PROFILE_MEMORY
      - CHECKPOINT_ENABLED
      - DEVICE=${DEVICE:-auto}
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/p2p/worker/main.py 50051
    networks:
      - torchslicer-p2p

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.${IMAGE_TAG:-cpu}
    image: torchslicer:${IMAGE_TAG:-cpu}
    container_name: p2p-worker1
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=false
      - WORKER_INDEX=1
      - WORKER_ADDRESS=worker1:50051
      - DEVICE=${DEVICE:-auto}
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/p2p/worker/main.py 50051
    networks:
      - torchslicer-p2p

networks:
  torchslicer-p2p:
    driver: bridge
