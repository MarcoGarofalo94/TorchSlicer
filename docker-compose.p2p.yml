# P2P topology — no coordinator process.
# Worker 0 (driver) owns the DataLoader, distributes model slices, drives training.
# Worker 1 (follower) waits for init() from driver, then serves forward/backward RPCs.
#
# Usage (GPU):
#   make run-p2p-gpu CONFIG=experiments/resnet18_2gpu_p2p.yaml
#
# Usage (CPU):
#   EXPERIMENT_CONFIG=experiments/resnet18_2gpu_p2p.yaml \
#     docker compose -f docker-compose.p2p.yml up --abort-on-container-exit

services:
  worker0:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: p2p-worker0
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=true
      - WORKER_INDEX=0
      - WORKER_ADDRESS=worker0:50051
      - WORKER_PEERS=worker0:50051,worker1:50051
      - EXPERIMENT_CONFIG
      - RUN_ID
      - EPOCHS
      - USE_GPIPE
      - N_MICRO
      - MIXED_PRECISION
      - LOG_ENABLED
      - LOG_DIR
      - PROFILE_VERBOSITY
      - PROFILE_MEMORY
      - CHECKPOINT_ENABLED
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/p2p/worker/main.py 50051
    networks:
      - torchslicer-p2p

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.cpu
    container_name: p2p-worker1
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - IS_DRIVER=false
      - WORKER_INDEX=1
      - WORKER_ADDRESS=worker1:50051
    volumes:
      - .:/workspace
      - ./lib/torchslicer:/usr/local/lib/torchslicer
    command: python3 examples/train/p2p/worker/main.py 50051
    networks:
      - torchslicer-p2p

networks:
  torchslicer-p2p:
    driver: bridge
