# GPU override for centralized topology.
# Adds NVIDIA device reservations to each worker.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Or via Makefile:
#   make run-centralized DEVICE=gpu CONFIG=...
#
# Requires: NVIDIA Container Toolkit + docker-images/Dockerfile.gpu image.
# Set IMAGE_TAG=gpu in .env or pass as env var so the GPU image is used.

services:
  worker1:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker2:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker3:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker4:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
