# GPU override for P2P topology.
# Usage: make run-p2p-gpu CONFIG=experiments/resnet18_2gpu_p2p.yaml

services:
  worker0:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
