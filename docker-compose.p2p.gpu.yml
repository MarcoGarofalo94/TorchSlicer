# GPU override for P2P topology.
# Adds NVIDIA device reservations to all P2P workers.
#
# Usage:
#   docker compose -f docker-compose.p2p.yml -f docker-compose.p2p.gpu.yml up --abort-on-container-exit
# Or via Makefile:
#   make run-p2p DEVICE=gpu CONFIG=...
#
# Requires: NVIDIA Container Toolkit + docker-images/Dockerfile.gpu image.
# Set IMAGE_TAG=gpu in .env or pass as env var so the GPU image is used.

services:
  worker0:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker1:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
