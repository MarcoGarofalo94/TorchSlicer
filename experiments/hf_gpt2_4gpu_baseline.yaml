# DistilGPT-2 / WikiText-2 — 4-worker GPU, full fine-tuning baseline
# Usage:
#   make run-hf-dist-gpu CONFIG=experiments/hf_gpt2_4gpu_baseline.yaml

run_id: hf_gpt2_baseline

model:
  name: distilgpt2
  task: causal_lm
  use_lora: false
  block_size: 128
  n_train: 4000
  batch_size: 16

training:
  epochs: 10
  optimizer:
    name: AdamW
    params:
      lr: 5.0e-5
  criterion:
    name: CrossEntropyLoss
    params: {}
  mixed_precision: false

pipeline:
  use_gpipe: false
  n_micro: 1

discovery:
  backend: coordinator
  n_workers: 4
  timeout: 120

checkpoint:
  enabled: false

logging:
  enabled: true
  dir: ./runs

profile:
  verbosity: 1
  memory: false
