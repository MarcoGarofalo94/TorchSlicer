# DistilGPT-2 / WikiText-2 — 4-worker GPU, GPipe micro-batch pipelining
# n_micro=4 splits each batch into 4 micro-batches, keeping all 4 workers busy
# Usage:
#   make run-hf-dist-gpu CONFIG=experiments/hf_gpt2_4gpu_gpipe.yaml

run_id: hf_gpt2_gpipe

model:
  name: distilgpt2
  task: causal_lm
  use_lora: false
  block_size: 128
  n_train: 4000
  batch_size: 64     # large batch to fill the pipeline

training:
  epochs: 40           # 4x more epochs to match gradient steps of batch_size=16 baseline
  optimizer:
    name: AdamW
    params:
      lr: 2.0e-4       # linear LR scaling: 5e-5 * (64/16) = 2e-4
  criterion:
    name: CrossEntropyLoss
    params: {}
  mixed_precision: false

pipeline:
  use_gpipe: true
  n_micro: 4

discovery:
  backend: coordinator
  n_workers: 4
  timeout: 120

checkpoint:
  enabled: false

logging:
  enabled: true
  dir: ./runs

profile:
  verbosity: 1
  memory: false
