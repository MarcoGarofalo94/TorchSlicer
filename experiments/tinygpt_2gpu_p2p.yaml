# TinyGPT / byte-level LM — 2-worker P2P GPU run
# Usage (Docker, one service per node; see docs/deploy/compose.md):
#   python -m torchslicer launch examples/train/lm/worker/main.py \
#       -c experiments/tinygpt_2gpu_p2p.yaml --target compose
#   docker compose -f runs/deploy/tinygpt-compose/docker-compose.yml up --exit-code-from driver

run_id: tinygpt_2gpu_p2p

training:
  epochs: 10
  optimizer:
    name: AdamW
    params:
      lr: 0.0003
      weight_decay: 0.01
  criterion:
    name: CrossEntropyLoss
    params: {}
  mixed_precision: false

pipeline:
  use_gpipe: false
  n_micro: 4

discovery:
  backend: static
  n_workers: 2
  peers:
    - lm-worker0:50051
    - lm-worker1:50051

logging:
  enabled: true
  dir: /workspace/runs

profile:
  verbosity: 1
  memory: false

checkpoint:
  enabled: false
  dir: ./checkpoints
  save_every: epoch
  resume: null

deploy:
  topology: p2p
  name: tinygpt
  image: torchslicer:gpu
  gpus: 1
