# DistilGPT-2 / WikiText-2 — 4-worker GPU, baseline at batch_size=64 (GPipe comparison)
# Usage:
#   make run-hf-dist-gpu CONFIG=experiments/hf_gpt2_4gpu_baseline_b64.yaml

run_id: hf_gpt2_baseline_b64

model:
  name: distilgpt2
  task: causal_lm
  use_lora: false
  block_size: 128
  n_train: 4000
  batch_size: 64

training:
  epochs: 40           # 4x more epochs to match gradient steps of batch_size=16 baseline
  optimizer:
    name: AdamW
    params:
      lr: 2.0e-4       # linear LR scaling: 5e-5 * (64/16) = 2e-4
  criterion:
    name: CrossEntropyLoss
    params: {}
  mixed_precision: false

pipeline:
  use_gpipe: false
  n_micro: 1

discovery:
  backend: coordinator
  n_workers: 4
  timeout: 120

checkpoint:
  enabled: false

logging:
  enabled: true
  dir: ./runs

profile:
  verbosity: 1
  memory: false
