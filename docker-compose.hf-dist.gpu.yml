# GPU override for HuggingFace distributed training.
# Usage: make run-hf-dist-gpu CONFIG=experiments/hf_gpt2_4gpu_baseline.yaml

services:
  coordinator:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu

  worker1:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker2:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker3:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker4:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
